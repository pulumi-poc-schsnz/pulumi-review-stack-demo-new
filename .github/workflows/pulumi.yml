name: Pulumi Deployments - Review Stacks

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, closed]

jobs:

  # =========================
  # 🚀 Production Deployment
  # =========================
  deploy-main:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      # Trigger Pulumi Deployment for production
      - name: Deploy to Production using Pulumi Deployments
        uses: pulumi/deployments-action@v1
        with:
          stack-name: Devikakrish/pulumi-review-stack-demo/prod
          operation: up
          upsert: false
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

  # =========================
  # 🔍 Review Stack Deployment
  # =========================
  review-stack:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      # Deploy PR review stack using Pulumi Deployments
      - name: Deploy Review Stack
        id: pulumi_deploy
        uses: pulumi/deployments-action@v1
        with:
          stack-name: Devikakrish/pulumi-review-stack-demo/pr-${{ github.event.pull_request.number }}
          operation: up
          upsert: true
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      # Comment on PR with deployment details
      - uses: actions/github-script@v7
        if: steps.pulumi_deploy.outputs.url
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🚀 Review Stack Ready
            
            🔗 **Preview URL:** ${{ steps.pulumi_deploy.outputs.url }}
            📊 **Deployment:** [View in Pulumi Console](https://app.pulumi.com/Devikakrish/pulumi-review-stack-demo/pr-${{ github.event.pull_request.number }})
            
            This environment is isolated from production and will be automatically cleaned up when the PR is closed.`
            })

  # =========================
  # 🧹 Cleanup After PR Closed
  # =========================
  cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      # Destroy review stack using Pulumi Deployments
      - name: Destroy Review Stack
        uses: pulumi/deployments-action@v1
        with:
          stack-name: Devikakrish/pulumi-review-stack-demo/pr-${{ github.event.pull_request.number }}
          operation: destroy
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        continue-on-error: true

      # Remove the stack
      - name: Remove Stack
        uses: pulumi/deployments-action@v1
        with:
          stack-name: Devikakrish/pulumi-review-stack-demo/pr-${{ github.event.pull_request.number }}
          operation: remove
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        continue-on-error: true

      # Notify cleanup completion
      - uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## 🧹 Review Stack Cleaned Up\n\nResources destroyed and stack removed via Pulumi Deployments.'
            });